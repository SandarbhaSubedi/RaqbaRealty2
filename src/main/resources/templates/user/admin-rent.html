<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin - Rent Requests</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
     <style>
        body {
            background-color:black;
            font-family: Arial, sans-serif;
            color: white;
        }
       .navbar {
            background-color: #343a40;
            padding: 15px 20px;
        }
        .navbar .nav-link {
            color: #ffffff;
            font-weight: 500;
            transition: color 0.3s;
        }
        .navbar .nav-link:hover, .navbar .nav-link.active {
            color: #ffc107;
        }
        .logo-img {
            height: 80px;
            width: auto;
        }
        
        .container {
    max-width: 1000px;
    margin: 40px auto;
    padding: 20px;
    background: black;
    box-shadow: 0px 0px 20px rgba(212, 175, 55, 0.8); /* golden glow */
    border-radius: 8px;
    text-align: center;
    color: white;
    border: 2px solid gold; /* proper border */
}
     
     
     .container table {
    
    color: white;
    background : black;
}
         .table tbody tr td {
    color: white !important;
    background : black;
}

 .table thead tr th {
    color: white !important;
    background : black;
}
    </style>
</head>


<body>
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/user/admindashboard">
            <img src="/img/logo.png" alt="Logo" class="logo-img">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="admindashboard" th:classappend="${page == 'admindashboard'} ? 'active' : ''">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="viewContacts" th:classappend="${page == 'contacts'} ? 'active' : ''">Contacts</a></li>
                <li class="nav-item"><a class="nav-link" href="upload" th:classappend="${page == 'upload'} ? 'active' : ''">Upload</a></li>
                <li class="nav-item"><a class="nav-link" href="usergallery" th:classappend="${page == 'usergallery'} ? 'active' : ''">Gallery</a></li>
                <li class="nav-item"><a class="nav-link" href="adminreviews" th:classappend="${page == 'areviews'} ? 'active' : ''">approvereview</a></li>
                <li class="nav-item"><a class="nav-link" href="admin-rent" th:classappend="${page == 'rent'} ? 'active' : ''">RentRequest</a></li>
            </ul>
        </div>
    </div>
</nav>
<div class = "container mt-4">
    <h2>Rent Requests</h2>

    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Number</th>
                <th>Email</th>
                <th>Property Type</th>
                <th>Requirement</th>
                <th>Location</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="req : ${requests}">
                <td th:text="${req.number}"></td>
                <td th:text="${req.email}"></td>
                <td th:text="${req.propertyType}"></td>
                <td th:text="${req.requirement}"></td>
                <td th:text="${req.location}"></td>
                <td>
                    <span th:text="${req.completed ? 'Completed' : 'Pending'}"></span>
                </td>
                <td>
                    <form th:action="@{/user/rent/complete/{id}(id=${req.id})}" method="post" style="display:inline;">
                        <button class="btn btn-success btn-sm" th:disabled="${req.completed}">Complete</button>
                    </form>
                    <form th:action="@{/user/rent/delete/{id}(id=${req.id})}" method="post" style="display:inline;">
                        <button class="btn btn-danger btn-sm">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
    </div>
</body>
</html>
