<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin - Manage Reviews</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0-alpha1/css/bootstrap.min.css">
    <style>
    
        body {
            background-color:black;
            font-family: Arial, sans-serif;
            color:white;
        }
        .navbar {
            background-color: #343a40;
            padding: 15px 20px;
        }
        .navbar .nav-link {
            color: #ffffff;
            font-weight: 500;
            transition: color 0.3s;
        }
        .navbar .nav-link:hover, .navbar .nav-link.active {
            color: #ffc107;
        }
        .logo-img {
            height: 80px;
            width: auto;
        }
        
        h1{
        text-align: center;
        margin-top: 30px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 40px auto;
    padding: 20px;
    background: black;
    box-shadow: 0px 0px 20px rgba(212, 175, 55, 0.8); /* golden glow */
    border-radius: 8px;
    text-align: center;
    color: white;
    border: 2px solid gold; /* proper border */
        }
        th, td {
            border: 1px solid #aaa;
            padding: 10px;
            text-align: left;
        }
        .pending {
            color: orange;
            font-weight: bold;
        }
        .approved {
            color: green;
            font-weight: bold;
        }
        button {
            margin-right: 5px;
            padding: 5px 10px;
        }
   
        .navbar {
            background-color: #343a40;
            padding: 15px 20px;
        }
        .navbar .nav-link {
            color: #ffffff;
            font-weight: 500;
            transition: color 0.3s;
        }
        .navbar .nav-link:hover, .navbar .nav-link.active {
            color: #ffc107;
        }
        .logo-img {
            height: 80px;
            width: auto;
        }
        
       
        
 
        
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/user/admindashboard">
            <img src="/img/logo.png" alt="Logo" class="logo-img">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="admindashboard" th:classappend="${page == 'admindashboard'} ? 'active' : ''">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="viewContacts" th:classappend="${page == 'contacts'} ? 'active' : ''">Contacts</a></li>
                <li class="nav-item"><a class="nav-link" href="upload" th:classappend="${page == 'upload'} ? 'active' : ''">Upload</a></li>
                <li class="nav-item"><a class="nav-link" href="usergallery" th:classappend="${page == 'usergallery'} ? 'active' : ''">Gallery</a></li>
                <li class="nav-item"><a class="nav-link" href="adminreviews" th:classappend="${page == 'areviews'} ? 'active' : ''">approvereview</a></li>
                <li class="nav-item"><a class="nav-link" href="admin-rent" th:classappend="${page == 'rent'} ? 'active' : ''">RentRequest</a></li>
            </ul>
        </div>
    </div>
</nav>
<h1>Manage Reviews</h1>
<table>
    <thead>
        <tr>
            <th>Full Name</th>
            <th>Email</th>
            <th>Location</th>
            <th>Review</th>
            <th>Rating</th>
            <th>Submitted At</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="review : ${reviews}">
            <td th:text="${review.fullName}"></td>
            <td th:text="${review.email}"></td>
            <td th:text="${review.location}"></td>
            <td th:text="${review.reviewMessage}"></td>
            <td th:text="${review.starRating}"></td>
            <td th:text="${review.submittedAt}"></td>
            <td>
                <span th:if="${review.approved}" class="approved">Approved</span>
                <span th:if="${!review.approved}" class="pending">Pending</span>
            </td>
            <td>
                <form th:action="@{'/user/' + ${review.id} + '/approve'}" method="post" th:if="${!review.approved}" style="display:inline">
                    <button type="submit">Approve</button>
                </form>
                <form th:action="@{'/user/' + ${review.id} + '/delete'}" method="post" style="display:inline" 
                      onsubmit="return confirm('Are you sure you want to delete this review?');">
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
    </tbody>
</table>
</body>
</html>
