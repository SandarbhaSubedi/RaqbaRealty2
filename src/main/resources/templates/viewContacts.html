<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts List</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0-alpha1/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
      <style>
        body {
            background-color:black;
            font-family: Arial, sans-serif;
            color:white;
        }
        .navbar {
            background-color: #343a40;
            padding: 15px 20px;
        }
        .navbar .nav-link {
            color: #ffffff;
            font-weight: 500;
            transition: color 0.3s;
        }
        .navbar .nav-link:hover, .navbar .nav-link.active {
            color: #ffc107;
        }
        .logo-img {
            height: 80px;
            width: auto;
        }
        
       
        
 .container {
    
    margin: 40px auto;
    padding: 20px;
    background: black;
    box-shadow: 0px 0px 20px rgba(212, 175, 55, 0.8); /* golden glow */
    border-radius: 8px;
    text-align: center;
    color: white;
    border: 2px solid gold; /* proper border */
}

 .container table {
    
    color: white;
    
}

 .table tbody tr td {
    color: white !important;
}

    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/user/admindashboard">
            <img src="/img/logo.png" alt="Logo" class="logo-img">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="admindashboard" th:classappend="${page == 'admindashboard'} ? 'active' : ''">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="viewContacts" th:classappend="${page == 'contacts'} ? 'active' : ''">Contacts</a></li>
                <li class="nav-item"><a class="nav-link" href="upload" th:classappend="${page == 'upload'} ? 'active' : ''">Upload</a></li>
                <li class="nav-item"><a class="nav-link" href="usergallery" th:classappend="${page == 'usergallery'} ? 'active' : ''">Gallery</a></li>
                <li class="nav-item"><a class="nav-link" href="adminreviews" th:classappend="${page == 'areviews'} ? 'active' : ''">approvereview</a></li>
                <li class="nav-item"><a class="nav-link" href="admin-rent" th:classappend="${page == 'rent'} ? 'active' : ''">RentRequest</a></li>
            </ul>
        </div>
    </div>
</nav>

    <div class="container mt-5">
        <h1 class="mb-4">Contacts List</h1>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Property Type</th>
                    <th>Bedroom Required</th>
                    <th>Maximum Budget</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="contact : ${contacts}">
                    <td th:text="${contact.id}"></td>
                    <td th:text="${contact.name}"></td>
                    <td th:text="${contact.email}"></td>
                    <td th:text="${contact.phone}"></td>
                    <td th:text="${contact.property}"></td>
                    <td th:text="${contact.bedroom}"></td>
                    <td th:text="${contact.currency}"></td>
                    <td>
                        <!-- Display the current status -->
                        <form th:action="@{/user/updateContactStatus}" method="post">
                            <input type="hidden" name="id" th:value="${contact.id}" />
                            <input type="text" name="status" th:value="${contact.status}" />
                            <button type="submit" class="btn btn-primary btn-sm">Update</button>
                        </form>
                    </td>
                    <td>
                    <td>
                            <button class="delete-btn" th:data-id="${contact.id}">Delete</button>

                        </td>
                    <td>
                   
                </tr>
            </tbody>
        </table>
    </div>
    <script>
        $(document).on('click', '.delete-btn', function() {
            var contactId = $(this).data('id');
            if (confirm('Are you sure you want to delete this contact?')) {
                $.ajax({
                    url: '/user/deleteContact',
                    method: 'DELETE',
                    data: { contactId: contactId },
                    success: function(response) {
                        alert(response);
                        location.reload(); // Reload the page to update the list
                    },
                    error: function(xhr, status, error) {
                        alert("Error deleting contact: " + error);
                    }
                });
            }
        });
    </script>
</body>
</html>
